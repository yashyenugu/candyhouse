name: CI

# The GATE. Runs on every pull request into main.
# Checks only the service(s) that changed (cheapest check first), and
# builds each changed service's Docker image so a broken Dockerfile fails the PR.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service: 'user-service/**'
            product-service: 'product-service/**'
            order-service: 'order-service/**'
            store-ui: 'store-ui/**'
            cicd: '.github/workflows/ci.yml'
      - id: resolve
        # A change to the CI file re-checks all four services; otherwise only the ones that changed.
        run: |
          if [ "${{ steps.filter.outputs.cicd }}" = "true" ]; then
            echo 'services=["user-service","product-service","order-service","store-ui"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ${{ matrix.service }}/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            yarn lint
          else
            echo "No lint script in $(basename "$PWD"); skipping."
          fi
      - name: Test
        run: |
          if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
            yarn test
          else
            echo "No test script in $(basename "$PWD"); skipping."
          fi

  # Build each changed service's Docker image (no push). This is the
  # "image builds on GitHub Actions" check: a broken Dockerfile fails the PR.
  build-image:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false

  # Single required status check. Mark THIS job required in branch protection.
  # Passes when verify and build-image succeeded or were skipped; fails if either failed.
  gate:
    if: always()
    needs: [changes, verify, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks to pass
        run: |
          echo "verify:      ${{ needs.verify.result }}"
          echo "build-image: ${{ needs.build-image.result }}"
          for r in "${{ needs.verify.result }}" "${{ needs.build-image.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "Gate failed: a changed service did not pass."
              exit 1
            fi
          done
          echo "Gate passed."
