# CandyHouse Local Development Infrastructure
# Lightweight setup for local development with minimal resource usage

services:
  # MongoDB - Single-node replica set (multi-document transactions need one).
  # Connect with ?replicaSet=rs0. The healthcheck initiates the set on first start.
  mongodb:
    image: mongo:5.0-focal
    container_name: candyhouse-mongodb-dev
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - candyhouse-dev
    healthcheck:
      test: |
        mongo --quiet --eval "var s = rs.status(); if (!s.ok) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s

  # Redis - Single instance (no Sentinel for development)
  redis:
    image: redis:7-alpine
    container_name: candyhouse-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass dev-redis-password
    volumes:
      - redis_data:/data
    networks:
      - candyhouse-dev

  # Kafka - Single broker with KRaft (no Zookeeper needed).
  # Official Apache image; bitnami/kafka:latest is no longer published.
  kafka:
    image: apache/kafka:3.8.0
    container_name: candyhouse-kafka-dev
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - candyhouse-dev
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for data persistence
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

# Custom network for service communication
networks:
  candyhouse-dev:
    driver: bridge
